name: Build KDP PDF

on:
  push:
    branches: [main]
    paths: ["chapters/**", "assets/images/**", "scripts/build-pdf.sh"]
  pull_request:
    paths: ["chapters/**", "assets/images/**", "scripts/build-pdf.sh"]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-linuxlibertine fonts-open-sans poppler-utils
      - run: scripts/build-pdf.sh
      - uses: actions/upload-artifact@v5
        with:
          name: kdp-interior
          path: build/interior.pdf
