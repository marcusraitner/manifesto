name: Link Check

on:
  pull_request:
  push:
    branches:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --base "https://marcusraitner.github.io/manifesto"
            --exclude "https://medium.com/wardleymaps/on-being-lost-2ef5f05eb1ec"
            --exclude "^https://marcusraitner\\.substack\\.com/"
            --exclude "^https://www\\.epi\\.org/"
            --exclude "^https://www\\.bloomberg\\.com/"
            --exclude "^https://www\\.nytimes\\.com/"
            --exclude "https://doi.org/10.1037/0022-3514.77.6.1121"
            --exclude "https://doi.org/10.1002/sdr.4260100206"
            "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
