<header class="site-header" role="banner">

  <div class="wrapper">
    <div class="site-title-block">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      {%- if site.subtitle -%}
        <span class="site-subtitle">{{ site.subtitle | escape }}</span>
      {%- endif -%}
    </div>

  </div>
</header>
